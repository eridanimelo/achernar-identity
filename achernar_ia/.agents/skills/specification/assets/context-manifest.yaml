# Manifesto interno de contexto. Criar antes de ler os arquivos listados.
#
# Convenção de caminhos deste manifesto:
# - paths sem prefixo = relativos à raiz do MOTOR (o diretório do framework);
# - `<specs>`, `<state>`, `<discovery>`, `<reviews>`, `<requirements>` =
#   nomes simbólicos, resolvidos por config/paths.yaml no projeto;
# - `<backend>`, `<frontend>`, `<docker>` = raízes do produto (paths.yaml).
execution:
  intent: REQUIREMENTS # REQUIREMENTS | ARTIFACT | FULL_SPEC
  stage: REQUIREMENTS
  feature: CHANGE_ME
  status: planned # planned | reading | completed

files:
  - path: AGENTS.md
    reason: regras do orquestrador e roteamento
    artifact: workflow
    required: true
  - path: config/PROJECT.yaml
    reason: identidade do projeto e fonte geral de requisitos
    artifact: workflow
    required: true
  - path: config/paths.yaml
    reason: raízes do projeto e caminhos oficiais
    artifact: workflow
    required: true
  - path: .agents/skills/specification/SKILL.md
    reason: processo e modo de execução
    artifact: business.md
    required: true
  - path: gates/contexto.md
    reason: critério de contexto antes de produzir o artefato
    artifact: workflow
    required: true
  - path: rules/specification/spec-structure.md
    reason: estrutura e estados permitidos
    artifact: business.md
    required: true
  - path: corporate/requirements/AGENT.md
    reason: responsabilidade do agente de requisitos
    artifact: business.md
    required: true
  - path: corporate/requirements/RULES.md
    reason: regras corporativas de requisitos
    artifact: business.md
    required: true
  - path: corporate/requirements/SKILL.md
    reason: procedimento corporativo de requisitos
    artifact: business.md
    required: true
  - path: corporate/requirements/templates/business.md
    reason: formato do artefato
    artifact: business.md
    required: true

optional_files:
  - path: <specs>/<ID>-<slug>/business.md
    reason: revisar requisito existente
    artifact: business.md
    condition: arquivo existente e intenção de revisão
  - path: <specs>/<ID>-<slug>/context-manifest.yaml
    reason: preservar o manifesto da execução anterior
    artifact: workflow
    condition: revisão de uma Spec existente

must_not_read:
  - config/technology.yaml
  - <backend>/**
  - <frontend>/**
  - corporate/api/**
  - corporate/database/**
  - corporate/security/**
  - corporate/testing/**
  - corporate/ui-ux/**
  - <specs>/** # exceto os arquivos explicitamente listados em optional_files
