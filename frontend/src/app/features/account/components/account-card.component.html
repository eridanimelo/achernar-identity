<section class="panel"><span class="eyebrow">SEU ESPAÇO</span><div class="title"><div><h1>Minha conta</h1><p class="muted">Bem-vindo, {{user().name}}.</p></div><span class="badge">{{user().profiles.join(', ') || 'Sem perfil ativo'}}</span></div><dl><dt>E-mail</dt><dd>{{user().email}}</dd><dt>Confirmação</dt><dd>E-mail confirmado</dd></dl><form #form="ngForm" (ngSubmit)="form.valid && saved.emit(name.trim())"><label for="name">Alterar nome</label><input id="name" name="name" [(ngModel)]="name" [placeholder]="user().name" required minlength="2" maxlength="100" autocomplete="name"><button mat-flat-button [disabled]="form.invalid || busy()">{{busy()?'Salvando…':'Salvar nome'}}</button></form>@if(message()){<p class="notice success" role="status">{{message()}}</p>}@if(error()){<p class="notice error" role="alert">{{error()}}</p>}<button mat-button class="logout" (click)="signedOut.emit()">Sair de todas as sessões</button></section>
