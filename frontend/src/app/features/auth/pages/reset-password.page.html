<app-auth-layout [title]="'auth.reset.title' | transloco">
  @if (done()) {
    <p role="status">{{ 'auth.reset.done' | transloco }}</p>
    <a mat-flat-button routerLink="/login">{{ 'auth.signIn' | transloco }}</a>
  } @else if (!hasToken() || invalidToken()) {
    <p role="alert">{{ 'auth.reset.invalid' | transloco }}</p>
    <a mat-stroked-button routerLink="/forgot-password">{{ 'auth.reset.requestNew' | transloco }}</a>
  } @else {
    <form class="form-column" [formGroup]="form" (ngSubmit)="submit()" appFocusInvalid novalidate>
      <app-error-summary [items]="summary()" [focusToken]="submits()" />
      @if (failure(); as f) {
        <app-form-alert [message]="failureMessage()" [traceId]="f.traceId" />
      }
      <app-password-field
        name="password"
        [control]="form.controls.password"
        [label]="'auth.newPassword' | transloco"
        [hint]="'password.hint' | transloco"
        autocomplete="new-password"
        [showMeter]="true"
      />
      <app-password-field name="confirm" [control]="form.controls.confirm" [label]="'auth.confirmPassword' | transloco" autocomplete="new-password" />
      <div class="actions">
        <button mat-flat-button type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
          @if (busy()) {
            <mat-spinner diameter="18" />
          }
          {{ 'auth.reset.submit' | transloco }}
        </button>
      </div>
    </form>
  }
</app-auth-layout>
