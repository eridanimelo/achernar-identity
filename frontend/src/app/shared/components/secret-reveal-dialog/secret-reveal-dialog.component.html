<h2 mat-dialog-title id="secret-title">{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ 'secret.warning' | transloco }}</p>
  <div class="secret">
    <code class="mono" data-testid="secret-value">{{ data.secret }}</code>
    <button mat-stroked-button type="button" (click)="copy()">
      <mat-icon aria-hidden="true">{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
      {{ (copied() ? 'common.copied' : 'common.copy') | transloco }}
    </button>
  </div>
  <span class="sr-only" role="status" aria-live="polite">{{ copied() ? ('common.copied' | transloco) : '' }}</span>
  @if (data.note) {
    <p class="muted">{{ data.note }}</p>
  }
  <mat-checkbox [checked]="saved()" (change)="saved.set($event.checked)">{{ 'secret.saved' | transloco }}</mat-checkbox>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button type="button" [disabled]="!saved()" (click)="close()">{{ 'common.close' | transloco }}</button>
</mat-dialog-actions>
