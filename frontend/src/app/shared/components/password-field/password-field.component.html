<mat-form-field appearance="outline" class="field">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [type]="inputType()"
    [formControl]="control()"
    [attr.id]="name()"
    [attr.name]="name()"
    [attr.autocomplete]="autocomplete()"
    [attr.spellcheck]="false"
    autocapitalize="off"
    required
    (input)="onInput($any($event.target).value)"
  />
  @if (showToggle()) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="toggle()"
      [attr.aria-pressed]="visible()"
      [attr.aria-label]="(visible() ? 'auth.hidePassword' : 'auth.showPassword') | transloco"
    >
      <mat-icon aria-hidden="true">{{ visible() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  }
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (error(); as e) {
    <mat-error>{{ e.key | transloco: e.params }}</mat-error>
  }
</mat-form-field>
@if (showMeter()) {
  <div class="meter" role="status" aria-live="polite">
    <div class="bar" [attr.data-level]="strength()" aria-hidden="true"><span></span></div>
    <span class="muted">{{ 'password.strength.' + strength() | transloco }}</span>
  </div>
}
