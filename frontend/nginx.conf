server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 16k;
 # Cabeçalhos de segurança apenas na entrega da SPA; respostas da API mantêm
 # os cabeçalhos definidos pelo backend. O Host do upstream é fixado para não
 # refletir o Host recebido do cliente.
 location = /index.html { include /etc/nginx/snippets/security-headers.conf; expires -1; }
 location / { include /etc/nginx/snippets/security-headers.conf; try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $proxy_host; }
 location /.well-known/ { proxy_pass http://backend:8080; proxy_set_header Host $proxy_host; }
}
