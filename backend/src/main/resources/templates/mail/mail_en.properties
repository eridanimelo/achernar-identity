common.footer=You received this email because it is linked to an access account. If this was not you, contact {{support_contact}}.
TPL-01.subject=Confirm your email for {{app_name}}
TPL-01.body=Hello! To activate your account, confirm your email. The link is valid for {{expires_in}}.
TPL-01.button=Confirm email
TPL-01.ignore=If you did not create an account, ignore this message.
TPL-02.subject=Password reset \u2014 {{app_name}}
TPL-02.body=We received a request to reset your password. The link is valid for {{expires_in}} and can be used once.
TPL-02.button=Reset password
TPL-02.ignore=If this wasn\u2019t you, ignore this; your password is unchanged.
TPL-03.subject=Confirm your new email
TPL-03.body=You asked to use this address for {{app_name}}. Confirm within {{expires_in}}.
TPL-03.button=Confirm new email
TPL-03.ignore=If this wasn\u2019t you, ignore it.
TPL-04.subject=Request to change your email
TPL-04.body=A change of your account email was requested. Nothing changes until it is confirmed at the new address. If this wasn\u2019t you, change your password now.
TPL-05.subject=Sign-up attempt with your email
TPL-05.body=Someone tried to create an account with this email. If it was you, sign in or reset your password. Otherwise no action is needed.
TPL-05.button=Sign in
TPL-05.button2=Forgot password
TPL-06.subject=Your password was changed
TPL-06.body=Your password was changed on {{occurred_at}} (approx. IP {{ip_approx}}). Other sessions were signed out. Not you?
TPL-06.button=Recover access
TPL-07.subject=Your email was changed
TPL-07.body=This account\u2019s email was changed on {{occurred_at}}. If this wasn\u2019t you, contact {{support_contact}} immediately.
TPL-08.subject=Too many sign-in attempts
TPL-08.body=We detected several sign-in attempts on your account. For security, new attempts are blocked for {{expires_in}}. If it was you, wait; otherwise reset your password.
TPL-08.button=Reset password
TPL-09.subject=Your account status
TPL-09.body.disabled=Your account was disabled on {{occurred_at}}. Questions: {{support_contact}}.
TPL-09.body.enabled=Your account was re-enabled on {{occurred_at}}. Questions: {{support_contact}}.
TPL-09.body=Your account status changed on {{occurred_at}}. Questions: {{support_contact}}.
TPL-10.subject.linked={{provider}} sign-in linked
TPL-10.subject.removed={{provider}} sign-in removed
TPL-10.subject={{provider}} sign-in changed
TPL-10.body.linked={{provider}} sign-in was linked to your account on {{occurred_at}}. Not you?
TPL-10.body.removed={{provider}} sign-in was removed from your account on {{occurred_at}}. Not you?
TPL-10.body={{provider}} sign-in was changed on your account on {{occurred_at}}. Not you?
TPL-10.button=Secure account
TPL-11.subject=Sessions signed out
TPL-11.body=All sessions of your account were signed out on {{occurred_at}}. If this wasn\u2019t you, change your password.
