common.footer=Voc\u00ea recebeu este e-mail porque ele est\u00e1 associado a uma conta de acesso. Se n\u00e3o foi voc\u00ea, contate {{support_contact}}.
TPL-01.subject=Confirme seu e-mail em {{app_name}}
TPL-01.body=Ol\u00e1! Para ativar sua conta, confirme seu e-mail. O link vale {{expires_in}}.
TPL-01.button=Confirmar e-mail
TPL-01.ignore=Se voc\u00ea n\u00e3o criou uma conta, ignore esta mensagem.
TPL-02.subject=Redefini\u00e7\u00e3o de senha \u2014 {{app_name}}
TPL-02.body=Recebemos um pedido para redefinir sua senha. O link vale {{expires_in}} e s\u00f3 pode ser usado uma vez.
TPL-02.button=Redefinir senha
TPL-02.ignore=Se n\u00e3o foi voc\u00ea, ignore; sua senha continua a mesma.
TPL-03.subject=Confirme seu novo e-mail
TPL-03.body=Voc\u00ea pediu para usar este endere\u00e7o em {{app_name}}. Confirme em {{expires_in}}.
TPL-03.button=Confirmar novo e-mail
TPL-03.ignore=Se n\u00e3o foi voc\u00ea, ignore.
TPL-04.subject=Pedido para alterar seu e-mail
TPL-04.body=Foi solicitada a troca do e-mail da sua conta. Nada mudar\u00e1 at\u00e9 a confirma\u00e7\u00e3o no novo endere\u00e7o. Se n\u00e3o foi voc\u00ea, altere sua senha agora.
TPL-05.subject=Tentativa de cadastro com seu e-mail
TPL-05.body=Algu\u00e9m tentou criar uma conta com este e-mail. Se foi voc\u00ea, entre ou recupere sua senha. Se n\u00e3o foi, nenhuma a\u00e7\u00e3o \u00e9 necess\u00e1ria.
TPL-05.button=Entrar
TPL-05.button2=Esqueci minha senha
TPL-06.subject=Sua senha foi alterada
TPL-06.body=Sua senha foi alterada em {{occurred_at}} (IP aproximado {{ip_approx}}). Outras sess\u00f5es foram encerradas. N\u00e3o foi voc\u00ea?
TPL-06.button=Recuperar acesso
TPL-07.subject=Seu e-mail foi alterado
TPL-07.body=O e-mail desta conta foi alterado em {{occurred_at}}. Se n\u00e3o foi voc\u00ea, contate {{support_contact}} imediatamente.
TPL-08.subject=Muitas tentativas de acesso
TPL-08.body=Detectamos v\u00e1rias tentativas de entrada na sua conta. Por seguran\u00e7a, novas tentativas ficam bloqueadas por {{expires_in}}. Se foi voc\u00ea, aguarde; sen\u00e3o, redefina sua senha.
TPL-08.button=Redefinir senha
TPL-09.subject=Status da sua conta
TPL-09.body.disabled=Sua conta foi desativada em {{occurred_at}}. D\u00favidas: {{support_contact}}.
TPL-09.body.enabled=Sua conta foi reativada em {{occurred_at}}. D\u00favidas: {{support_contact}}.
TPL-09.body=O status da sua conta mudou em {{occurred_at}}. D\u00favidas: {{support_contact}}.
