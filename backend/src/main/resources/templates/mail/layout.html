<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1b1f23">
<div style="max-width:600px;margin:0 auto;padding:16px">
<table role="presentation" width="100%" style="background:#ffffff;border-radius:8px;padding:24px">
<tr><td>
<p style="font-size:14px;color:#4a5560;margin:0 0 16px">{{app_name}}</p>
<h1 style="font-size:20px;margin:0 0 16px">{{title}}</h1>
<p style="margin:0 0 16px">{{body}}</p>
{{buttons}}
<p style="margin:16px 0 0;color:#3a444d">{{ignore}}</p>
</td></tr>
</table>
<p style="font-size:14px;color:#4a5560;margin:16px 0 0">{{footer}}</p>
</div>
</body>
</html>
