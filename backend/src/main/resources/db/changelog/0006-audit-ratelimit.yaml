# Eventos de segurança, contadores de taxa e bloqueio de login. data-model.md §2.12 e §2.14.
# Desvio documentado: details em text (JSON serializado pela aplicação) e ip em varchar(45) para evitar
# dependência de mapeadores específicos de jsonb/inet no ORM.
databaseChangeLog:
  - changeSet:
      id: 0006-1
      author: achernar
      changes:
        - sql:
            sql: |
              CREATE TABLE security_event (
                id               uuid         NOT NULL PRIMARY KEY,
                occurred_at      timestamptz  NOT NULL,
                event_type       varchar(48)  NOT NULL,
                severity         varchar(8)   NOT NULL,
                outcome          varchar(8)   NOT NULL,
                account_id       uuid,
                actor_account_id uuid,
                client_id        varchar(64),
                session_id       uuid,
                ip               varchar(45),
                user_agent       varchar(255),
                request_id       varchar(64),
                details          text         NOT NULL DEFAULT '{}',
                CONSTRAINT ck_event_severity CHECK (severity IN ('INFO','NOTICE','ALERT')),
                CONSTRAINT ck_event_outcome CHECK (outcome IN ('SUCCESS','FAILURE'))
              );
              CREATE INDEX ix_event_time ON security_event (occurred_at DESC, id DESC);
              CREATE INDEX ix_event_account ON security_event (account_id, occurred_at DESC);
              CREATE INDEX ix_event_type ON security_event (event_type, occurred_at DESC);
              CREATE INDEX ix_event_client ON security_event (client_id, occurred_at DESC);
              CREATE INDEX ix_event_alert ON security_event (occurred_at DESC) WHERE severity = 'ALERT';

              CREATE TABLE rate_limit_counter (
                key          varchar(200) NOT NULL,
                window_start timestamptz  NOT NULL,
                count        integer      NOT NULL,
                PRIMARY KEY (key, window_start)
              );
              CREATE INDEX ix_rate_limit_window ON rate_limit_counter (window_start);

              CREATE TABLE login_lock (
                key_hash      varchar(64) NOT NULL PRIMARY KEY,
                failure_count integer     NOT NULL,
                window_start  timestamptz NOT NULL,
                locked_until  timestamptz,
                lock_level    integer     NOT NULL DEFAULT 0,
                last_lock_at  timestamptz
              );
