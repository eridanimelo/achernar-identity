# Achernar Identity — configuração base. Todo valor sensível vem de variável de ambiente (ver parameters.md e docker/.env.example).
# Convenção *_FILE: o AchernarSecretsEnvironmentPostProcessor lê VAR_FILE (conteúdo aparado) quando VAR não estiver definida.
spring:
  application:
    name: achernar-identity-api
  profiles:
    default: dev
  datasource:
    url: ${ACHERNAR_DB_URL:jdbc:postgresql://localhost:5432/achernar_identity}
    username: ${ACHERNAR_DB_USER:achernar_identity}
    password: ${ACHERNAR_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ACHERNAR_DB_POOL_SIZE:20}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${ACHERNAR_SMTP_HOST:localhost}
    port: ${ACHERNAR_SMTP_PORT:1025}
    username: ${ACHERNAR_SMTP_USERNAME:}
    password: ${ACHERNAR_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ACHERNAR_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${ACHERNAR_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: ${ACHERNAR_SERVER_PORT:8080}
  forward-headers-strategy: none     # IP real: TrustedProxyResolver (P-47), nunca o Host/X-Forwarded-Host (SEC-22)
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 64KB

management:
  server:
    port: ${ACHERNAR_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,signingKey
  health:
    mail:
      enabled: false          # a disponibilidade não depende do SMTP (RNF-05)

logging:
  level:
    root: INFO
    com.eridani.achernar: INFO

achernar:
  issuer: ${ACHERNAR_ISSUER:http://localhost:8080}
  ui-base-url: ${ACHERNAR_UI_BASE_URL:http://localhost:4200}
  ui-origins: ${ACHERNAR_UI_ORIGINS:http://localhost:4200}
  ui-audience: ${ACHERNAR_UI_AUDIENCE:achernar-identity-api}
  default-locale: ${ACHERNAR_DEFAULT_LOCALE:pt-BR}
  master-key: ${ACHERNAR_MASTER_KEY:}
  dev-insecure-key: ${ACHERNAR_DEV_INSECURE_KEY:false}
  bootstrap-token: ${ACHERNAR_BOOTSTRAP_TOKEN:}
  trusted-proxies: ${ACHERNAR_TRUSTED_PROXIES:}
  cors-max-age: ${ACHERNAR_CORS_MAX_AGE:PT10M}
  max-body-bytes: 16384
  clock-skew: ${ACHERNAR_CLOCK_SKEW:PT60S}
  cookie:
    secure: ${ACHERNAR_COOKIE_SECURE:true}
    domain: ${ACHERNAR_COOKIE_DOMAIN:}
  token:
    access-ttl: ${ACHERNAR_TOKEN_ACCESS_TTL:PT10M}
  session:
    refresh-ttl: ${ACHERNAR_SESSION_REFRESH_TTL:P7D}
    max-lifetime: ${ACHERNAR_SESSION_MAX_LIFETIME:P30D}
    max-active: ${ACHERNAR_SESSION_MAX_ACTIVE:10}
    reauth-window: ${ACHERNAR_REAUTH_WINDOW:PT5M}
  refresh:
    reuse-grace: ${ACHERNAR_REFRESH_REUSE_GRACE:PT10S}
  key:
    rotation-interval: ${ACHERNAR_KEY_ROTATION_INTERVAL:P90D}
    publish-lead: ${ACHERNAR_KEY_PUBLISH_LEAD:PT24H}
    retired-retention: ${ACHERNAR_KEY_RETIRED_RETENTION:PT48H}
    rsa-bits: ${ACHERNAR_KEY_RSA_BITS:3072}
    jwks-cache-max-age: ${ACHERNAR_JWKS_CACHE_MAX_AGE:PT5M}
  password:
    min-length: ${ACHERNAR_PASSWORD_MIN_LENGTH:12}
    max-length: ${ACHERNAR_PASSWORD_MAX_LENGTH:128}
    argon2-memory-kib: ${ACHERNAR_ARGON2_MEMORY_KIB:19456}
    argon2-iterations: ${ACHERNAR_ARGON2_ITERATIONS:2}
    argon2-parallelism: ${ACHERNAR_ARGON2_PARALLELISM:1}
    hash-concurrency: ${ACHERNAR_HASH_CONCURRENCY:0}      # 0 = 2 x núcleos (P-79)
  one-time:
    verify-email-ttl: ${ACHERNAR_VERIFY_EMAIL_TTL:PT24H}
    password-reset-ttl: ${ACHERNAR_PASSWORD_RESET_TTL:PT30M}
    email-change-ttl: ${ACHERNAR_EMAIL_CHANGE_TTL:PT1H}
  social:
    exchange-code-ttl: ${ACHERNAR_SOCIAL_EXCHANGE_CODE_TTL:PT60S}
    transaction-ttl: ${ACHERNAR_SOCIAL_TRANSACTION_TTL:PT10M}
    google-client-id: ${ACHERNAR_GOOGLE_CLIENT_ID:}
    google-client-secret: ${ACHERNAR_GOOGLE_CLIENT_SECRET:}
    facebook-app-id: ${ACHERNAR_FACEBOOK_APP_ID:}
    facebook-app-secret: ${ACHERNAR_FACEBOOK_APP_SECRET:}
    facebook-graph-version: ${ACHERNAR_FACEBOOK_GRAPH_VERSION:v23.0}
    http-timeout: PT5S
  mail:
    from: ${ACHERNAR_MAIL_FROM:no-reply@achernar.local}
    from-name: ${ACHERNAR_MAIL_FROM_NAME:Achernar Identity}
    reply-to: ${ACHERNAR_MAIL_REPLY_TO:}
    support-contact: ${ACHERNAR_MAIL_SUPPORT_CONTACT:}
    max-attempts: ${ACHERNAR_MAIL_MAX_ATTEMPTS:6}
    failed-retention: ${ACHERNAR_MAIL_FAILED_RETENTION:P7D}
    worker-interval: ${ACHERNAR_MAIL_WORKER_INTERVAL:PT10S}
    worker-batch: ${ACHERNAR_MAIL_WORKER_BATCH:20}
  retention:
    unverified-account: ${ACHERNAR_RETENTION_UNVERIFIED_ACCOUNT:P7D}
    one-time-tokens: ${ACHERNAR_RETENTION_ONE_TIME_TOKENS:P7D}
    sessions: ${ACHERNAR_RETENTION_SESSIONS:P30D}
    security-events: ${ACHERNAR_RETENTION_SECURITY_EVENTS:P365D}
    event-ip: ${ACHERNAR_RETENTION_EVENT_IP:P90D}
    outbox-sent: ${ACHERNAR_RETENTION_OUTBOX_SENT:P3D}
    rate-limit: ${ACHERNAR_RETENTION_RATE_LIMIT:P1D}
    retired-keys: ${ACHERNAR_RETENTION_RETIRED_KEYS:P30D}
    batch-size: 1000
  jobs:
    key-rotation-cron: ${ACHERNAR_JOB_KEY_ROTATION_CRON:0 0 * * * *}
    retention-cron: ${ACHERNAR_JOB_RETENTION_CRON:0 0 3 * * *}
    maintenance-cron: ${ACHERNAR_JOB_MAINTENANCE_CRON:0 30 3 * * *}
