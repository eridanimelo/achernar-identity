# Achernar Identity — Postgres + MailHog (desenvolvimento).
# Backend e frontend rodam fora do Compose nesta etapa.
# Uso (a partir de docker/): `docker compose up -d`
# ou `docker compose --env-file .env up -d` após copiar `.env.example` para `.env`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: achernar_identity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-achernar_identity}
      POSTGRES_USER: ${POSTGRES_USER:-achernar_identity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-achernar_identity}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - achernar_identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-achernar_identity} -d $${POSTGRES_DB:-achernar_identity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: achernar_identity_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"   # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"     # Web UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  achernar_identity_pgdata:
    name: achernar_identity_pgdata
